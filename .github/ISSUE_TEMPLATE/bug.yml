name: Bug
description: Fehlverhalten von Agent, Workflow oder Daten
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options: ["agent", "n8n", "airtable", "telephony", "stripe", "langfuse", "docs"]
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduktion
      description: Schritte, Call-ID / Run-ID / Langfuse-Trace (keine Personendaten)
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Erwartet vs. tatsächlich
    validations: {required: true}
  - type: dropdown
    id: impact
    attributes:
      label: Auswirkung
      options: ["P0 – Anrufe/Zahlungen falsch, sofort stoppen", "P1 – Funktion kaputt", "P2 – eingeschränkt", "P3 – kosmetisch"]
    validations: {required: true}
